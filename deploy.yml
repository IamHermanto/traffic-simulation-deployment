---
- name: Deploy Traffic Management System
  hosts: traffic_servers
  become: yes
  vars:
    github_repo: "https://github.com/IamHermanto/traffic-simulation-deployment"
    
  tasks:
    - name: Update and upgrade system packages
      apt:
        update_cache: yes
        upgrade: dist
        
    - name: Install system dependencies
      apt:
        name:
          - python3-flask
          - python3-requests
          - git
          - libglu1-mesa
          - libxcursor1
          - libxrandr2
          - libxi6
          - libxinerama1
        state: present
        
    - name: Create application directories
      file:
        path: "{{ item }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'
      loop:
        - /home/ubuntu/unity-traffic
        - /home/ubuntu/traffic-api
        - /tmp/unity-traffic
        - /tmp/unity-traffic/commands
        - /tmp/deployment
        
    - name: Clone repository
      git:
        repo: "{{ github_repo }}.git"
        dest: /tmp/deployment
        
    - name: Copy Unity build files
      copy:
        src: /tmp/deployment/unity-build/
        dest: /home/ubuntu/unity-traffic/
        remote_src: yes
        owner: ubuntu
        group: ubuntu
        mode: preserve
        
    - name: Set library path for Unity
      lineinfile:
        path: /etc/environment
        line: 'LD_LIBRARY_PATH=/home/ubuntu/unity-traffic:$LD_LIBRARY_PATH'
        create: yes
        
    - name: Make Unity executable
      file:
        path: /home/ubuntu/unity-traffic/server.x86_64
        mode: '0755'
        
    - name: Copy Flask API
      copy:
        src: /tmp/deployment/traffic_api.py
        dest: /home/ubuntu/traffic-api/traffic_api.py
        remote_src: yes
        owner: ubuntu
        group: ubuntu
        mode: '0644'
        
    - name: Create systemd service for Unity
      copy:
        dest: /etc/systemd/system/unity-traffic.service
        content: |
          [Unit]
          Description=Unity Traffic System
          After=network.target
          
          [Service]
          Type=simple
          User=ubuntu
          WorkingDirectory=/home/ubuntu/unity-traffic
          Environment="LD_LIBRARY_PATH=/home/ubuntu/unity-traffic"
          ExecStart=/home/ubuntu/unity-traffic/server.x86_64 --debug
          Restart=always
          
          [Install]
          WantedBy=multi-user.target
          
    - name: Create systemd service for Flask API
      copy:
        dest: /etc/systemd/system/traffic-api.service
        content: |
          [Unit]
          Description=Traffic Management API
          After=unity-traffic.service
          Requires=unity-traffic.service
          
          [Service]
          Type=simple
          User=ubuntu
          WorkingDirectory=/home/ubuntu/traffic-api
          ExecStart=/usr/bin/python3 traffic_api.py
          Restart=always
          
          [Install]
          WantedBy=multi-user.target
          
    - name: Enable and start Unity service
      systemd:
        name: unity-traffic
        enabled: yes
        state: started
        daemon_reload: yes
        
    - name: Enable and start API service
      systemd:
        name: traffic-api
        enabled: yes
        state: started
        daemon_reload: yes
        
    - name: Clean up
      file:
        path: /tmp/deployment
        state: absent